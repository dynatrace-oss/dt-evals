name: Release

on:
  push:
    branches:
      - main
      - build-issue

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  publish-npm:
      runs-on: ubuntu-latest
      environment: release
      permissions:
          id-token: write # OIDC token for npm trusted publishing
          contents: read
      if: ${{ fromJSON(needs.release-please.outputs.build_config).mode == 'npm' && fromJSON(needs.release-please.outputs.release_created || false) }}
      defaults:
        run:
          shell: bash
          working-directory: ${{ fromJSON(needs.release-please.outputs.build_config).folder }}
      env:
          FOLDER: "dt-eval-cli"

      steps:
          - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

          - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
            with:
                node-version-file: "${{ env.FOLDER }}/.nvmrc"
                registry-url: https://registry.npmjs.org

          - name: Install dependencies
            run: npm ci

          - name: Build
            run: npm run build

          - name: Publish package
            run: npm publish --access public --tag alpha
