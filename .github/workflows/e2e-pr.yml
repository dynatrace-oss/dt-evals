---
name: E2E — PR checks (no credentials)

# PR-time gate for test/e2e — the credentialed suite only runs weekly.
# Spends nothing: typechecks the workspace and runs whatever needs no
# credentials, invoked whole so new tests are covered automatically.
on:
  push:
    branches:
      - 'main'
  pull_request:
    paths:
      - "test/e2e/**"
      - ".github/workflows/e2e-pr.yml"
      - "dt-eval-cli/**"
      # dt-eval-cli only consumes dt-eval-lib via its pinned npm version, so a
      # lib-only PR needs the source-build override below to get feedback here.
      - "dt-eval-lib/**"
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Typecheck & credential-free tests
    defaults:
      run:
        shell: bash
        working-directory: test/e2e
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: "dt-eval-cli/.nvmrc"
          cache: "npm"
          cache-dependency-path: |
            dt-eval-cli/package-lock.json
            dt-eval-lib/package-lock.json
            test/e2e/package-lock.json

      - name: Build dt-eval-lib from source
        working-directory: dt-eval-lib
        run: |
          npm ci
          npm run build

      # Non-blocking: `npm audit` exits non-zero when it finds anything, but a
      # transitive dep vuln shouldn't fail unrelated PRs. The notify step below
      # reports findings to Slack instead of gating the merge.
      - name: Audit dt-eval-lib dependencies
        working-directory: dt-eval-lib
        run: npm audit --json > "${{ runner.temp }}/dt-eval-lib-audit.json" || true

      # npm install after npm ci overrides the registry-pinned dt-eval-lib
      # with the just-built local one, for this job only (never committed).
      - name: Build the CLI under test
        working-directory: dt-eval-cli
        run: |
          npm ci
          npm install ../dt-eval-lib
          npm run build

      - name: Audit dt-eval-cli dependencies
        working-directory: dt-eval-cli
        run: npm audit --json > "${{ runner.temp }}/dt-eval-cli-audit.json" || true

      - name: Install E2E dependencies
        run: npm ci

      - name: Audit test/e2e dependencies
        run: npm audit --json > "${{ runner.temp }}/test-e2e-audit.json" || true

      - name: Typecheck
        run: npm run typecheck

      - name: Run everything that needs no credentials
        run: npx vitest run

      # Runs even if typecheck/tests above failed, so a vulnerability is still
      # reported on a red run. Skips quietly if the SLACK_HOOK secret isn't set
      # (e.g. on forks) instead of failing the job.
      - name: Notify Slack of dependency vulnerabilities
        if: always()
        # Slack delivery failing (bad webhook, transient network error) must not
        # fail the PR job — vulnerabilities are meant to alert, not to block merges.
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          SLACK_HOOK: ${{ secrets.SLACK_HOOK }}
          AUDIT_FILES: >-
            ${{ runner.temp }}/dt-eval-lib-audit.json
            ${{ runner.temp }}/dt-eval-cli-audit.json
            ${{ runner.temp }}/test-e2e-audit.json
        run: "${{ github.workspace }}/.github/scripts/notify-vulnerabilities.sh"
