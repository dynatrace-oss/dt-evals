---
name: CI — dt-eval-engine

on:
  pull_request:
    paths:
      - "dt-eval-deploy/**"
      - "dt-eval-lib/**"
      - ".github/workflows/ci-engine.yml"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    name: Test & Build
    defaults:
        run:
          shell: bash
          working-directory: dt-eval-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "${{ env.FOLDER }}/.nvmrc"
          registry-url: https://registry.npmjs.org
          cache: "npm"
          cache-dependency-path: "${{ env.FOLDER }}/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker build (smoke test)
        run: docker build -t dt-eval-engine:ci .
