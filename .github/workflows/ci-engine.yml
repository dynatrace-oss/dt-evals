---
name: CI — dt-eval-engine

on:
  pull_request:
    paths:
      - "dt-eval-deploy/**"
      - "dt-eval-lib/**"
      - ".github/workflows/ci-engine.yml"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    name: Test & Build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build dt-eval-lib
        working-directory: dt-eval-lib
        run: npm run build

      - name: Test
        working-directory: dt-eval-deploy
        run: npm test

      - name: Build
        working-directory: dt-eval-deploy
        run: npm run build

      - name: Docker build (smoke test)
        working-directory: dt-eval-deploy
        run: docker build -t dt-eval-engine:ci .
