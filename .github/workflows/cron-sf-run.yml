name: Run dt-evals for smartfreight every 20m

on:
  schedule:
    - cron: "*/20 * * * *"

  workflow_dispatch:
    inputs:
      since:
        description: "Time window (e.g. 20m, 1h, 6h, 24h)"
        required: false
        default: "20m"
      sample:
        description: "Sample percentage (overrides config)"
        required: false
      dry_run:
        description: "Run without writing bizevents"
        type: boolean
        required: false
        default: false
      dt_eval_debug:
        description: "Enable debug mode in dt-eval"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

env:
  DT_EVAL_VERSION: latest
  DT_EVAL_DEBUG: ${{ inputs.dt_eval_debug || 'false' }}
  DT_EVAL_SINCE: ${{ inputs.since || '20m' }}
  DT_EVAL_SAMPLE: ${{ inputs.sample || '' }}
  DT_EVAL_DRY_RUN: ${{ inputs.dry_run || 'false' }}

jobs:
  run-evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dynatrace-tenant:
          - live
          - live3gen
          - playground

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::246186168471:role/gha-dynatrace-oss-dt-evals-fa0cfd"
          aws-region: us-east-1

      - name: Get Dynatrace URL and API token from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            ,dt-evals-cron/${{ matrix.dynatrace-tenant }}
          parse-json-secrets: true

      - name: Authenticate to Google Cloud for AI token
        uses: google-github-actions/auth@v3
        with:
          project_id: dynatrace-demoability
          workload_identity_provider: "projects/959021067757/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc"
          service_account: "gha-dt-evals-fa0cfdd3@dynatrace-demoability.iam.gserviceaccount.com"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install @dynatrace-oss/dt-evals
        run: |
          npm init -y --silent >/dev/null
          npm install \
            "@dynatrace-oss/dt-evals@${DT_EVAL_VERSION}"

      - name: Run evaluations
        env:
          DT_EVAL_CONFIG: configs/smartfreight/${{ matrix.dynatrace-tenant }}.yaml
        run: |
          set -euo pipefail
          ARGS=(run \
            --config "$DT_EVAL_CONFIG" \
            --since "$DT_EVAL_SINCE" \
            --ci)
          if [[ -n "$DT_EVAL_SAMPLE" ]]; then
            ARGS+=(--sample "$DT_EVAL_SAMPLE")
          fi
          if [[ "$DT_EVAL_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          if [[ "$DT_EVAL_DEBUG" == "true" ]]; then
            ARGS+=(--debug)
          fi
          ./node_modules/.bin/dt-evals "${ARGS[@]}"
