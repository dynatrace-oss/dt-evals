---
name: E2E — dt-evals CLI

# Runs the built CLI against a real Dynatrace tenant and a real judge
# provider. Deliberately NOT triggered by pull_request — real secrets and
# spend stay off the PR path. Scheduled a few hours after the fixture spans
# are seeded (dynatrace-ai-agent-instrumentation-examples replays them nightly
# at ~03:00 UTC; this suite only reads them back).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — after the upstream ~03:00 UTC seeding
  workflow_dispatch:
    inputs:
      suite:
        description: "Run only this suite (cli, tenant, contract, validate, run, evallogic). Blank runs all."
        required: false
        type: string
      fixture_lookback:
        description: "How far back to look for fixture spans (DQL duration, e.g. 24h, 7d)"
        required: false
        default: "24h"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # 120, not 90: summing per-test timeouts, the blocking lane's worst case is
    # already ~103 minutes of test time alone; checkout, two npm ci calls and
    # the build add several more minutes on top. A job killed by the cap gives
    # no vitest summary at all.
    timeout-minutes: 120
    # Plain repository secrets, not a GitHub environment — a deliberate
    # tradeoff against the setup cost of an admin-only environment.
    defaults:
      run:
        shell: bash
        working-directory: test/e2e
    # Only non-secrets at job level; credentials attach to the "Run E2E suite" step only.
    env:
      # Bedrock matches the credentials the sibling E2E suite already provisions.
      E2E_JUDGE_PROVIDER: ${{ vars.E2E_JUDGE_PROVIDER || 'bedrock' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      # Left empty so the CLI's own default model applies; override via the E2E_JUDGE_MODEL repo variable.
      E2E_JUDGE_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      # Missing credentials must fail the run, not skip it — a suite that skips everything still reports green.
      E2E_REQUIRE_ENV: "1"
      E2E_FIXTURE_LOOKBACK: ${{ inputs.fixture_lookback || '24h' }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Nothing here authenticates to git, so don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: "dt-eval-cli/.nvmrc"
          cache: "npm"
          cache-dependency-path: |
            dt-eval-cli/package-lock.json
            test/e2e/package-lock.json

      # Built from this checkout, so the run tests the commit under test, not what's on npm.
      - name: Build the CLI under test
        working-directory: dt-eval-cli
        run: |
          npm ci
          npm run build

      - name: Install E2E dependencies
        run: npm ci

      # `suite` passed through env, matched against a closed list, not
      # interpolated — `${{ }}` substitutes before bash parses the line.
      - name: Run E2E suite
        env:
          # E2E_-prefixed to avoid falling back to an org-wide secret, and to
          # avoid colliding with the music-agent workflow's own DT_* secrets.
          DT_APPS_ENDPOINT: ${{ secrets.E2E_DT_APPS_ENDPOINT }}
          DT_API_TOKEN: ${{ secrets.E2E_DT_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          case "${SUITE:-}" in
            "")
              # Excluded rather than listed, so a new suite lands here by default.
              npx vitest run --bail=1 --exclude 'suites/evallogic.e2e.test.ts'
              ;;
            cli | tenant | contract | validate | run | evallogic)
              npx vitest run "suites/${SUITE}.e2e.test.ts"
              ;;
            *)
              echo "::error::unknown suite '${SUITE}' — expected one of: cli, tenant, contract, validate, run, evallogic" >&2
              exit 1
              ;;
          esac

  # The flaky lane: evallogic asserts on a judge's decision, which wobbles, so it alerts rather than blocking.
  verdict:
    name: Verdict suite (non-blocking)
    needs: [e2e]
    # Falsy covers both `''` (dispatch) and unset (schedule).
    if: ${{ !inputs.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Job-level, so a red verdict lane doesn't fail the workflow.
    continue-on-error: true
    outputs:
      # steps.*.outcome is the step's own result *before* continue-on-error is
      # applied. needs.verdict.result is the job's conclusion *after* it — which
      # this job's own continue-on-error normalizes to "success" regardless of
      # whether run_verdict failed, making it useless to the notify job below.
      outcome: ${{ steps.run_verdict.outcome }}
    defaults:
      run:
        shell: bash
        working-directory: test/e2e
    env:
      E2E_JUDGE_PROVIDER: ${{ vars.E2E_JUDGE_PROVIDER || 'bedrock' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      E2E_JUDGE_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      E2E_REQUIRE_ENV: "1"
      E2E_FIXTURE_LOOKBACK: ${{ inputs.fixture_lookback || '24h' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: "dt-eval-cli/.nvmrc"
          cache: "npm"
          cache-dependency-path: |
            dt-eval-cli/package-lock.json
            test/e2e/package-lock.json

      - name: Build the CLI under test
        working-directory: dt-eval-cli
        run: |
          npm ci
          npm run build

      - name: Install E2E dependencies
        run: npm ci

      # Secrets attached to this step only, same reason as the e2e job.
      - name: Run verdict suite
        id: run_verdict
        env:
          DT_APPS_ENDPOINT: ${{ secrets.E2E_DT_APPS_ENDPOINT }}
          DT_API_TOKEN: ${{ secrets.E2E_DT_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
        run: npx vitest run suites/evallogic.e2e.test.ts

      - name: Flag a verdict-lane failure
        if: ${{ failure() }}
        run: |
          echo "::warning title=Verdict lane failed::The judge did not return the expected pass/fail direction for the toxicity fixtures. Re-run once before treating it as a regression."

  # One sticky issue per label, so a scheduled run doesn't fail silently.
  # Scheduled runs only — a manual dispatch has someone watching it already.
  notify:
    name: Notify on failure or recovery
    needs: [e2e, verdict]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_RESULT: ${{ needs.e2e.result }}
          # The verdict job's own output (steps.run_verdict.outcome), not needs.verdict.result —
          # that job's continue-on-error normalizes its result to "success" either way. `skipped`
          # when a dispatch named a single suite; notify-e2e.sh treats that as "not a failure".
          VERDICT_OUTCOME: ${{ needs.verdict.outputs.outcome }}
        run: bash .github/scripts/notify-e2e.sh
