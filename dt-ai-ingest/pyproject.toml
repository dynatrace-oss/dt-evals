[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dt-ai-ingest"
version = "0.1.0"
description = "Ingest AI evaluation results (custom, file, or inline) into Dynatrace as BizEvents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Dynatrace AI Observability" },
]
keywords = ["dynatrace", "llm", "evaluation", "bizevents", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=14",
]
ragas = [
    "ragas>=0.2",
]

[project.urls]
Homepage = "https://github.com/dynatrace-oss/dt-ai-ingest"
Repository = "https://github.com/dynatrace-oss/dt-ai-ingest"
Issues = "https://github.com/dynatrace-oss/dt-ai-ingest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dt_ai_ingest"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["examples/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit a real Dynatrace tenant (need DT_ENDPOINT + DT_ACCESS_TOKEN)",
]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0.0",
    "pytest-httpx>=0.36.0",
    "ruff>=0.1.0",
]
