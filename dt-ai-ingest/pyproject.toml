[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dt-ai-ingest"
version = "0.1.0"
description = "Ingest AI observability data from evaluation frameworks into Dynatrace Grail"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Dynatrace AI Observability" },
]
keywords = ["dynatrace", "llm", "evaluation", "ragas", "mlflow", "langfuse", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.optional-dependencies]
ragas = ["ragas>=0.2.0", "datasets>=2.14.0"]
mlflow = ["mlflow>=2.8.0", "opentelemetry-instrumentation>=0.41b0", "pandas>=1.5.0", "python-dotenv>=1.0.0"]
langfuse = ["langfuse>=4.0.0"]
deepeval = ["deepeval>=3.0.0"]
all = ["dt-ai-ingest[ragas,mlflow,langfuse,deepeval]"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0.0",
    "pytest-httpx>=0.36.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/dynatrace-oss/dt-ai-ingest"
Repository = "https://github.com/dynatrace-oss/dt-ai-ingest"
Issues = "https://github.com/dynatrace-oss/dt-ai-ingest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dt_ai_ingest"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit a real Dynatrace tenant (need DT_ENDPOINT + DT_ACCESS_TOKEN)",
]

[tool.mypy]
python_version = "3.10"
strict = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.0",
]
